<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="TaskFlow — a clean, fast task manager for work and personal tasks." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="color-scheme" content="light dark" />
    <title>TaskFlow</title>
    <script>
      // Apply a saved light/dark choice before first paint to avoid a theme flash.
      // Must match STORAGE_KEYS.PREFERENCES and applyTheme() in src/state/theme.js.
      try {
        const theme = JSON.parse(localStorage.getItem('taskflow:preferences') || '{}').theme
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme
      } catch (error) {
        // Storage blocked or data invalid: fall back to the system theme.
      }
    </script>
  </head>
  <body>
    <noscript>TaskFlow requires JavaScript to run.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
